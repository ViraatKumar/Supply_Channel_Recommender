server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;

    # Single page, no router — but this keeps a hard refresh on any path working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin /api in the container, matching the Vite proxy in dev, so the
    # frontend never needs an environment-specific base URL.
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
